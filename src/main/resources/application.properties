
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=inventory
quarkus.datasource.password=inventory
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/inventory-service

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

quarkus.container-image.group=local
quarkus.container-image.name=inventory-service
quarkus.container-image.tag=latest

# REDIS CONFIG
quarkus.redis.hosts=redis://localhost:6379

## KAFKA CONFIG
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.gerar-notificacao.topic=notificacoes
mp.messaging.outgoing.gerar-notificacao.connector=smallrye-kafka

mp.messaging.incoming.receber-itens.topic=pedidos
mp.messaging.incoming.receber-itens.connector=smallrye-kafka
mp.messaging.incoming.receber-itens.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer