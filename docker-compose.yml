services:
  db:
    image: postgres:17.5-alpine3.22
    restart: always
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728
    environment:
      POSTGRES_PASSWORD: inventory
      POSTGRES_USER: inventory
      POSTGRES_DB: inventory-service
    ports:
      - "5433:5432"

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    restart: always

  app:
    image: local/inventory-monitor:latest
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/inventory-service
      QUARKUS_DATASOURCE_USERNAME: inventory
      QUARKUS_DATASOURCE_PASSWORD: inventory